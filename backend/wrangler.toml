name = "cet6-pronunciation-assessment"
main = "pronunciation-worker.js"
compatibility_date = "2026-10-07"

[vars]
ALLOWED_ORIGIN = "https://adrian0314.github.io"
# Replace with the endpoint shown in your Azure Speech resource. No path or trailing query.
SPEECH_ENDPOINT = ""

# Secrets (never put their values here): SPEECH_KEY, ASSESSMENT_ACCESS_TOKEN
[observability]
enabled = false

[[ratelimits]]
name = "ASSESSMENT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
