# Optional compatibility deployment. Recommended domestic deployment: tencent-scf.zip.
name = "cet6-pronunciation-assessment"
main = "pronunciation-worker.js"
compatibility_date = "2026-10-07"

[vars]
ALLOWED_ORIGIN = "https://adrian0314.github.io"

# Secrets: TENCENT_SECRET_ID, TENCENT_SECRET_KEY, ASSESSMENT_ACCESS_TOKEN
